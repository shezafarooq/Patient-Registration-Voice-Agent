<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f4" />
    <title>Patient Registry</title>
    <link rel="stylesheet" href="/static/dashboard.css?v=2" />
  </head>
  <body>
    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Patient Registration</p>
          <h1>Patient Registry</h1>
        </div>
        <div class="topbar-actions">
          <button class="primary-button" id="add-patient-button" type="button">Add patient</button>
          <span class="connection" id="connection-status" aria-live="polite">Loading</span>
          <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh patient records" title="Refresh patient records">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4M4 5v4h4M4 13a8 8 0 0 0 14.9 4M20 19v-4h-4" /></svg>
          </button>
        </div>
      </header>

      <section class="toolbar" aria-label="Patient filters">
        <label>
          <span>Last name</span>
          <input id="last-name-filter" type="search" autocomplete="off" placeholder="Search last name" />
        </label>
        <label>
          <span>Date of birth</span>
          <input id="dob-filter" type="text" inputmode="numeric" placeholder="MM/DD/YYYY" />
        </label>
        <label>
          <span>Phone number</span>
          <input id="phone-filter" type="tel" autocomplete="off" placeholder="(555) 555-5555" />
        </label>
        <button class="text-button" id="clear-filters" type="button">Clear</button>
      </section>

      <section class="registry" aria-labelledby="patient-count">
        <div class="registry-heading">
          <p id="patient-count">Patients</p>
          <p id="last-updated"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Patient</th>
                <th scope="col">Date of birth</th>
                <th scope="col">Phone</th>
                <th scope="col">Location</th>
                <th scope="col">Registered</th>
                <th scope="col"><span class="visually-hidden">View record</span></th>
              </tr>
            </thead>
            <tbody id="patient-table-body"></tbody>
          </table>
          <div class="table-message" id="table-message" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <dialog id="patient-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Patient record</p>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-button" id="close-dialog" type="button" aria-label="Close patient record" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <dl id="patient-details" class="details-grid"></dl>
      <div class="dialog-actions">
        <button class="danger-button" id="delete-patient-button" type="button">Delete record</button>
      </div>
    </dialog>

    <dialog id="patient-form-dialog" aria-labelledby="form-dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Manual registration</p>
          <h2 id="form-dialog-title">Add patient</h2>
        </div>
        <button class="icon-button" id="close-form-dialog" type="button" aria-label="Close patient form" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <form id="patient-form">
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="form-grid">
          <label><span>First name</span><input name="first_name" required maxlength="50" /></label>
          <label><span>Last name</span><input name="last_name" required maxlength="50" /></label>
          <label><span>Date of birth</span><input name="date_of_birth" required inputmode="numeric" placeholder="MM/DD/YYYY" /></label>
          <label><span>Sex</span><select name="sex" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Decline to Answer</option></select></label>
          <label><span>Phone number</span><input name="phone_number" required type="tel" placeholder="(555) 555-5555" /></label>
          <label><span>Email</span><input name="email" type="email" /></label>
          <label class="full-width"><span>Street address</span><input name="address_line_1" required maxlength="200" /></label>
          <label><span>Apt, suite, unit</span><input name="address_line_2" maxlength="100" /></label>
          <label><span>City</span><input name="city" required maxlength="100" /></label>
          <label><span>State</span><input name="state" required maxlength="2" placeholder="CA" /></label>
          <label><span>ZIP code</span><input name="zip_code" required inputmode="numeric" placeholder="12345" /></label>
          <label><span>Preferred language</span><input name="preferred_language" placeholder="English" /></label>
          <label><span>Insurance provider</span><input name="insurance_provider" /></label>
          <label><span>Insurance member ID</span><input name="insurance_member_id" /></label>
          <label><span>Emergency contact name</span><input name="emergency_contact_name" /></label>
          <label><span>Emergency contact phone</span><input name="emergency_contact_phone" type="tel" /></label>
        </div>
        <div class="dialog-actions">
          <button class="text-button" id="cancel-form" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save patient</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/static/dashboard.js?v=2"></script>
  </body>
</html>
