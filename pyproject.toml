[project]
name = "patient-registration-agent"
version = "0.1.0"
description = "Voice-agent backend for patient demographic registration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "email-validator>=2.2,<3.0",
  "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
